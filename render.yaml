services:
  - type: web
    name: printhub-portal
    runtime: node
    plan: starter
    disk:
      name: printhub-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
